# ============================================
# Lab 13 - Spring Data JPA Configuration
# Cấu hình H2 In-Memory Database (Bài 1)
# ============================================

# Server
server.port=8080
spring.application.name=lab13-spring-data-jpa

# Thymeleaf
spring.thymeleaf.cache=false

# H2 Database (In-Memory)
spring.datasource.url=jdbc:h2:mem:eautdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform tự động detect bởi Hibernate

# H2 Console (truy cập tại /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Khởi tạo dữ liệu mẫu
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

