# Chạy với profile: --spring.profiles.active=mysql
# ============================================

server.port=8080
spring.application.name=lab13-spring-data-jpa

# Thymeleaf
spring.thymeleaf.cache=false

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/lab13_eaut?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Khởi tạo dữ liệu mẫu
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
