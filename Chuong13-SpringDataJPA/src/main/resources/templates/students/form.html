<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Sửa Sinh viên' : 'Thêm Sinh viên'} + ' - Lab 13'">Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🎓 Lab 13 - Spring Data JPA</a>
    <ul class="navbar-nav">
        <li><a th:href="@{/}">🏠 Trang chủ</a></li>
        <li><a th:href="@{/students}">👨‍🎓 Sinh viên</a></li>
        <li><a th:href="@{/courses}">📚 Khóa học</a></li>
    </ul>
</nav>
<div class="container" style="max-width:800px;">
    <div class="page-header">
        <div>
            <h1 th:text="${isEdit ? '✏️ Chỉnh sửa Sinh viên' : '➕ Thêm Sinh viên mới'}"></h1>
            <p>Dữ liệu sẽ được lưu vào bảng <code>students</code> qua <code>JpaRepository.save()</code></p>
        </div>
        <a th:href="@{/students}" class="btn btn-secondary">← Quay lại</a>
    </div>
    <div class="card">
        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-row">
                <div class="form-group">
                    <label for="studentCode">Mã sinh viên <span class="required">*</span></label>
                    <input type="text" id="studentCode" th:field="*{studentCode}" class="form-control" th:classappend="${#fields.hasErrors('studentCode')} ? 'is-invalid'" placeholder="VD: 20230752">
                    <div class="error-feedback" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></div>
                </div>
                <div class="form-group">
                    <label for="fullName">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="VD: Nguyễn Văn Hùng">
                    <div class="error-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="VD: hung@eaut.edu.vn">
                    <div class="error-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label for="className">Lớp học <span class="required">*</span></label>
                    <input type="text" id="className" th:field="*{className}" class="form-control" th:classappend="${#fields.hasErrors('className')} ? 'is-invalid'" placeholder="VD: DCCNTT 14.2">
                    <div class="error-feedback" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phoneNumber">Số điện thoại</label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" placeholder="VD: 0912345678">
                </div>
                <div class="form-group">
                    <label for="address">Địa chỉ</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="VD: Hà Nội">
                </div>
            </div>
            <div style="margin-top:1.5rem; display:flex; gap:0.75rem;">
                <button type="submit" class="btn btn-success" th:text="${isEdit ? '💾 Cập nhật' : '➕ Lưu vào CSDL'}"></button>
                <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>
<footer class="footer"><p>Lab 13 — Spring Data JPA © 2025 | Nguyễn Văn Hùng — 20230752 | DCCNTT 14.2 — EAUT</p></footer>
</body>
</html>
