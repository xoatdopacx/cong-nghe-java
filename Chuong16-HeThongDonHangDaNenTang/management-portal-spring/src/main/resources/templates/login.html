<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Management Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            padding: 2.5rem;
            width: 360px;
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo .icon { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
        .logo h1 { font-size: 1.2rem; color: #e2e8f0; }
        .logo p { font-size: .8rem; color: #64748b; margin-top: .25rem; }
        .alert { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .85rem; }
        .alert-danger { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .4rem; color: #94a3b8; }
        input[type=text], input[type=password] {
            width: 100%; padding: .7rem 1rem;
            background: #0f0f1a; border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px; color: #e2e8f0; font-size: .875rem;
        }
        input:focus { outline: none; border-color: #6366f1; }
        .btn-login {
            width: 100%; padding: .75rem; background: #6366f1; color: white;
            border: none; border-radius: 8px; font-size: .9rem;
            font-weight: 600; cursor: pointer; transition: background .15s;
        }
        .btn-login:hover { background: #4f46e5; }
        .hint { margin-top: 1.5rem; padding: 1rem; background: rgba(99,102,241,.1); border-radius: 8px; font-size: .78rem; color: #64748b; }
        .hint p { margin-bottom: .3rem; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <span class="icon">🏢</span>
        <h1>Management Portal</h1>
        <p>Lab 16 - Spring Boot (Port 8081)</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        ❌ Sai tên đăng nhập hoặc mật khẩu!
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ Đã đăng xuất thành công!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" placeholder="manager01 hoặc admin01" required>
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="123456" required>
        </div>
        <button type="submit" class="btn-login">Đăng nhập →</button>
    </form>

    <div class="hint">
        <p><strong style="color:#94a3b8">Tài khoản demo (mật khẩu: 123456):</strong></p>
        <p>🔴 admin01 - Quản trị hệ thống</p>
        <p>🔵 manager01 - Quản lý đơn hàng</p>
    </div>
</div>
</body>
</html>
