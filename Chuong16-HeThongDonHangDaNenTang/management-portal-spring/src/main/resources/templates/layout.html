<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 16 - Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5;
            --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
            --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #16213e;
            --border: rgba(255,255,255,0.08); --text: #e2e8f0; --muted: #64748b;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        .sidebar { width: 240px; min-height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 0; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
        .sidebar .logo { padding: 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 1rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: .5rem; }
        .sidebar nav { padding: 1rem 0; flex: 1; }
        .sidebar nav a { display: flex; align-items: center; gap: .75rem; padding: .65rem 1.25rem; color: var(--muted); text-decoration: none; font-size: .875rem; font-weight: 500; transition: all .15s; border-left: 3px solid transparent; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(99,102,241,.12); color: var(--primary); border-left-color: var(--primary); }
        .sidebar .user-info { padding: 1rem 1.25rem; border-top: 1px solid var(--border); font-size: .8rem; color: var(--muted); }
        .sidebar .user-info strong { color: var(--text); display: block; margin-bottom: .25rem; }
        .logout-btn { display: inline-flex; align-items: center; gap: .4rem; color: var(--danger); font-size: .8rem; margin-top: .5rem; padding: .4rem .75rem; border-radius: 6px; border: 1px solid rgba(239,68,68,.3); background: transparent; cursor: pointer; width: 100%; transition: background .15s; }
        .logout-btn:hover { background: rgba(239,68,68,.12); }
        .main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
        .topbar h1 { font-size: 1.1rem; font-weight: 600; }
        .content { padding: 2rem; flex: 1; }
        .alert { padding: .85rem 1.25rem; border-radius: 8px; margin-bottom: 1rem; font-size: .875rem; }
        .alert-success { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
        .alert-danger  { background: rgba(239,68,68,.15);  border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .stat-card .label { font-size: .75rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 700; }
        .stat-card.clr-primary .value { color: var(--primary); }
        .stat-card.clr-amber   .value { color: var(--accent); }
        .stat-card.clr-green   .value { color: var(--success); }
        .stat-card.clr-purple  .value { color: #c084fc; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: .95rem; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: .75rem 1rem; text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: .85rem 1rem; font-size: .875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,.02); }
        .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 7px; font-size: .8rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: all .15s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: rgba(255,255,255,.05); }
        .btn-danger { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
        .btn-danger:hover { background: rgba(239,68,68,.3); }
        .btn-sm { padding: .3rem .75rem; font-size: .75rem; }
        .badge { display: inline-block; padding: .25rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
        .badge-pending    { background: rgba(245,158,11,.2); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
        .badge-processing { background: rgba(99,102,241,.2); color: #818cf8; border: 1px solid rgba(99,102,241,.3); }
        .badge-ready      { background: rgba(6,182,212,.2);  color: #22d3ee; border: 1px solid rgba(6,182,212,.3); }
        .badge-shipping   { background: rgba(168,85,247,.2); color: #c084fc; border: 1px solid rgba(168,85,247,.3); }
        .badge-completed  { background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
        .badge-cancelled  { background: rgba(239,68,68,.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .4rem; color: var(--muted); }
        .form-control { width: 100%; padding: .65rem .9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .875rem; transition: border-color .15s; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        textarea.form-control { resize: vertical; }
        select.form-control option { background: var(--bg); }
        .filter-bar { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-bar a { padding: .4rem .85rem; border-radius: 6px; font-size: .8rem; font-weight: 500; text-decoration: none; color: var(--muted); border: 1px solid var(--border); transition: all .15s; }
        .filter-bar a:hover, .filter-bar a.active { background: var(--primary); color: white; border-color: var(--primary); }
        .pagination { display: flex; gap: .5rem; justify-content: center; margin-top: 1.5rem; }
        .pagination a, .pagination .pg-active { padding: .4rem .75rem; border-radius: 6px; font-size: .8rem; text-decoration: none; border: 1px solid var(--border); color: var(--text); }
        .pagination a:hover { background: var(--primary); border-color: var(--primary); }
        .pagination .pg-active { background: var(--primary); border-color: var(--primary); }
    </style>
</head>
<body th:fragment="layout(pageTitle, activeMenu)">
<div class="sidebar">
    <div class="logo">🏢 Management</div>
    <nav>
        <a th:href="@{/}"         th:class="${activeMenu == 'dashboard'} ? 'active' : ''">📊 Dashboard</a>
        <a th:href="@{/orders}"   th:class="${activeMenu == 'orders'}    ? 'active' : ''">📦 Đơn hàng</a>
        <a th:href="@{/products}" th:class="${activeMenu == 'products'}  ? 'active' : ''">🛒 Sản phẩm</a>
    </nav>
    <div class="user-info">
        <strong sec:authentication="name">User</strong>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">🚪 Đăng xuất</button>
        </form>
    </div>
</div>
<div class="main">
    <div class="topbar">
        <h1 th:text="${pageTitle}">Dashboard</h1>
        <span style="font-size:.8rem;color:var(--muted)">Lab 16 · Spring Boot · Port 8081</span>
    </div>
    <div class="content">
        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}"   class="alert alert-danger"  th:text="${errorMsg}"></div>
        <th:block th:replace="${content}"/>
    </div>
</div>
</body>
</html>
