# ============================================
# Lab 16 - Management Portal Configuration
# ============================================
server.port=8081
spring.application.name=management-portal-spring

# Thymeleaf
spring.thymeleaf.cache=false

# MySQL Datasource (dùng chung java_integrated_lab)
spring.datasource.url=jdbc:mysql://localhost:3306/java_integrated_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.vn.edu.eaut=INFO
