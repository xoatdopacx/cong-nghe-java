<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="template.xhtml">
    <ui:define name="title">Đăng nhập JSF</ui:define>
    <ui:define name="content">
        <div class="card" style="max-width:450px;margin:40px auto;">
            <h2>Đăng nhập (Bài 8)</h2>

            <h:messages globalOnly="true" layout="table" styleClass="global-msg-error"
                        infoClass="global-msg" errorClass="global-msg-error" />

            <h:form>
                <div class="form-group">
                    <label for="user">Tên đăng nhập:</label>
                    <h:inputText id="user" value="#{loginBean.username}"
                                 required="true" requiredMessage="Vui lòng nhập tên đăng nhập"
                                 style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="user" styleClass="msg-error" />
                </div>

                <div class="form-group">
                    <label for="pass">Mật khẩu:</label>
                    <h:inputSecret id="pass" value="#{loginBean.password}"
                                   required="true" requiredMessage="Vui lòng nhập mật khẩu"
                                   style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="pass" styleClass="msg-error" />
                </div>

                <div style="margin-top:15px;">
                    <h:commandButton value="Đăng nhập" action="#{loginBean.login}" styleClass="btn btn-primary"
                                     style="width:100%;" />
                </div>
            </h:form>

            <p style="margin-top:15px;text-align:center;color:#888;font-size:13px;">
                Tài khoản mẫu: <strong>admin</strong> / <strong>123456</strong>
            </p>
        </div>
    </ui:define>
</ui:composition>
</html>
