<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="template.xhtml">
    <ui:define name="title">Form sản phẩm JSF</ui:define>
    <ui:define name="content">
        <div class="card">
            <h2>Thêm sản phẩm mới (Bài 7)</h2>

            <h:messages globalOnly="true" styleClass="global-msg" />

            <h:form>
                <div class="form-group">
                    <label for="ten">Tên sản phẩm:</label>
                    <h:inputText id="ten" value="#{productBean.product.tenSanPham}"
                                 required="true" requiredMessage="Tên sản phẩm bắt buộc nhập"
                                 style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="ten" styleClass="msg-error" />
                </div>

                <div class="form-group">
                    <label for="gia">Giá (VNĐ):</label>
                    <h:inputText id="gia" value="#{productBean.product.gia}"
                                 converterMessage="Giá phải là số"
                                 style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="gia" styleClass="msg-error" />
                </div>

                <div class="form-group">
                    <label for="soluong">Số lượng:</label>
                    <h:inputText id="soluong" value="#{productBean.product.soLuong}"
                                 converterMessage="Số lượng phải là số nguyên"
                                 style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="soluong" styleClass="msg-error" />
                </div>

                <div class="form-group">
                    <label for="mota">Mô tả:</label>
                    <h:inputText id="mota" value="#{productBean.product.moTa}"
                                 style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;" />
                    <h:message for="mota" styleClass="msg-error" />
                </div>

                <div style="margin-top:15px;">
                    <h:commandButton value="Lưu sản phẩm" action="#{productBean.save}" styleClass="btn btn-primary" />
                </div>
            </h:form>

            <p style="margin-top:15px;">
                <h:link outcome="product-list" value="Xem danh sách sản phẩm →" />
            </p>
        </div>
    </ui:define>
</ui:composition>
</html>
